name: CI

# Validation only. This workflow never authenticates to a registry and never publishes an
# artefact; publishing is the responsibility of .github/workflows/release.yml.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read application version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build image (validation only, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: student-ml-api:ci-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            GIT_COMMIT=${{ github.sha }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          docker run -d --name ci-smoke -p 5000:5000 student-ml-api:ci-${{ github.sha }}
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then
              echo "\nHealth endpoint responded on attempt ${attempt}."
              docker rm -f ci-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Health endpoint did not respond in time."
          docker logs ci-smoke
          docker rm -f ci-smoke
          exit 1
