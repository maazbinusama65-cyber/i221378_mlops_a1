name: Release

# Publishing is driven exclusively by semantic version tags, never by a pull request.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: student-ml-api

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Derive release metadata from the Git tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 1.0.0 is derived from v1.0.0; the version is never hard-coded here.
          VERSION="${TAG#v}"
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "short_sha=${GITHUB_SHA:0:7}"
            echo "image=${REGISTRY}/${OWNER}/${IMAGE_NAME}"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Verify the VERSION file matches the Git tag
        run: |
          FILE_VERSION="$(cat VERSION)"
          if [ "${FILE_VERSION}" != "${{ steps.meta.outputs.version }}" ]; then
            echo "VERSION file (${FILE_VERSION}) does not match Git tag (${{ steps.meta.outputs.version }})."
            exit 1
          fi
          echo "VERSION file and Git tag agree on ${FILE_VERSION}."

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Short-lived token issued to this workflow run; no credential is stored in YAML.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "${{ steps.meta.outputs.tag }}" \
            --notes "Image: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\`
          Commit: \`${{ github.sha }}\`
          Digest: \`${{ steps.build.outputs.digest }}\`"

      - name: Record traceability chain
        run: |
          {
            echo "### Release ${{ steps.meta.outputs.tag }}"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Git tag | \`${{ steps.meta.outputs.tag }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Image | \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\` |"
            echo "| Also tagged | \`latest\`, \`${{ steps.meta.outputs.short_sha }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
